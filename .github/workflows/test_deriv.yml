name: Probar conexión Deriv API

# Prueba manual: Actions → "Probar conexión Deriv API" → Run workflow
on:
  workflow_dispatch: {}

jobs:
  test-deriv:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerías
        run: pip install websockets

      - name: Verificar que el secreto llegó
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          T="$DERIV_API_TOKEN"
          echo "Longitud token = ${#T}"
          echo "Primeros 6: ${T:0:6}"
          echo "Últimos 6:  ...${T: -6}"
          echo "App ID = ${DERIV_APP_ID:-VACIO}"
          if [ "${T:0:1}" = '"' ] || [ "${T: -1}" = '"' ]; then
            echo "⚠️ El token tiene COMILLAS — se pegó mal."
          fi

      - name: Probar conexión (auth + símbolos + cotización)
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: python test_deriv_api.py
